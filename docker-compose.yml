# Local full stack. Copy backend/.env.example -> backend/.env and fill values.
# (Phase 1: db + redis + api. worker/beat land in Phase 2 with Celery.)
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: wedfind
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: wedfind
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wedfind"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: [backend/.env]
    environment:
      DATABASE_URL: postgresql+psycopg://wedfind:dev@db:5432/wedfind
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /app/uploads
      GOOGLE_APPLICATION_CREDENTIALS: /app/firebase-service-account.json
      ENV: development
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ["8002:8000"]
    volumes:
      - ./uploads:/app/uploads
      # Service-account key mounted at runtime (NOT baked into the image).
      - ./backend/firebase-service-account.json:/app/firebase-service-account.json:ro
    command: >
      sh -c "alembic upgrade head &&
             gunicorn app.main:app -k uvicorn.workers.UvicornWorker -w 1 -b 0.0.0.0:8000"

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: [backend/.env]
    environment:
      DATABASE_URL: postgresql+psycopg://wedfind:dev@db:5432/wedfind
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /app/uploads
      GOOGLE_APPLICATION_CREDENTIALS: /app/firebase-service-account.json
      ENV: development
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes:
      - ./uploads:/app/uploads
      - ./backend/firebase-service-account.json:/app/firebase-service-account.json:ro
    command: celery -A app.workers.celery_app worker -Q default,face,thumbs,maintenance -c 2 --loglevel=info
    # Image HEALTHCHECK curls /livez (web only); use a Celery ping for the worker.
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: [backend/.env]
    environment:
      DATABASE_URL: postgresql+psycopg://wedfind:dev@db:5432/wedfind
      REDIS_URL: redis://redis:6379/0
      GOOGLE_APPLICATION_CREDENTIALS: /app/firebase-service-account.json
      ENV: development
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes:
      - ./backend/firebase-service-account.json:/app/firebase-service-account.json:ro
    command: celery -A app.workers.celery_app beat --loglevel=info
    # Disable the inherited web HEALTHCHECK; beat has no useful ping target.
    healthcheck:
      disable: true

volumes:
  pgdata: {}
